<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Short Video App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      position: relative;
      background: #111;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Video Player */
    .video-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Top Header */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .balance-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .reward-badge {
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    /* Notification Ticker */
    .notifications {
      position: absolute;
      top: 60px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
    }
    .toast {
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      animation: fadeIn 0.5s ease-in-out;
    }

    /* Right Action Sidebar */
    .side-bar {
      position: absolute;
      right: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }
    .action-btn span {
      margin-top: 3px;
    }
    .icon-box {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }

    /* Overlay Overlay Content */
    .bottom-overlay {
      position: absolute;
      bottom: 60px;
      left: 10px;
      right: 60px;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .video-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .video-desc {
      font-size: 12px;
      color: #ddd;
    }

    /* Bottom Navigation */
    .nav-bar {
      height: 55px;
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
      z-index: 10;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #888;
      cursor: pointer;
    }
    .nav-item.active {
      color: #a855f7;
    }
    .nav-item div {
      font-size: 18px;
      margin-bottom: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="balance-badge">💵 ৳ 3201.18</div>
      <div class="reward-badge">আরও ৳ 2,798.82 উপার্জন করুন</div>
    </div>

    <!-- Notification Ticker -->
    <div class="notifications">
      <div class="toast">🎉 আয়েশা দাস সফলভাবে টাকা তুলেছেন</div>
      <div class="toast">🎉 আরিফ তালুকদার টাকা তুলেছেন</div>
    </div>

    <!-- Video Player Area -->
    <div class="video-container">
      <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted></video>
      
      <!-- Video Text Overlay -->
      <div class="bottom-overlay">
        <div class="video-title">She forgot the future...</div>
        <div class="video-desc">The night I confessed my love to my girlfriend, she broke down in...</div>
      </div>

      <!-- Right Side Actions -->
      <div class="side-bar">
        <div class="action-btn">
          <div class="icon-box">💵</div>
          <span>0/3</span>
        </div>
        <div class="action-btn">
          <div class="icon-box">❤️</div>
          <span>ফলো</span>
        </div>
        <div class="action-btn">
          <div class="icon-box">⚡</div>
          <span>1.0x</span>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
      <div class="nav-item">
        <div>T</div>
        <span>এক্সপ্লোর</span>
      </div>
      <div class="nav-item active">
        <div>🔍</div>
        <span>শর্টস</span>
      </div>
      <div class="nav-item">
        <div>🎁</div>
        <span>পুরস্কার</span>
      </div>
      <div class="nav-item">
        <div>🖤</div>
        <span>প্রিয়</span>
      </div>
      <div class="nav-item">
        <div>👤</div>
        <span>প্রোফাইল</span>
      </div>
    </div>
  </div>

</body>
</html>
