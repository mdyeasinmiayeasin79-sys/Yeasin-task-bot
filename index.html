<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Earning Web App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; }
        .profile { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .profile h3 { color: #333; margin-bottom: 5px; }
        .profile p { color: #666; font-size: 14px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .stats div { padding: 4px 0; }
        .captcha-box { text-align: center; margin-bottom: 15px; }
        .captcha-img { background: #fff3cd; color: #856404; font-size: 28px; font-weight: bold; letter-spacing: 5px; padding: 15px; border-radius: 8px; border: 2px dashed #ffebaba0; user-select: none; margin-bottom: 12px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 10px; text-align: center; outline: none; }
        button { width: 100%; padding: 12px; background: #0088cc; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #006699; }
        .msg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; min-height: 20px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <div class="profile">
        <h3 id="userName">Dear Sharmin Jahan</h3>
        <p>Location - Bangladesh 🇧🇩</p>
    </div>

    <div class="stats">
        <div>💰 Total: <b id="balance">20</b> BDT</div>
        <div>✅ Correct: <b id="correct">10</b></div>
        <div>❌ Wrong: <b id="wrong">0</b></div>
        <div>🎯 Success Rate: <b id="rate">100%</b></div>
    </div>

    <div class="captcha-box">
        <div id="captchaCode" class="captcha-img">13290</div>
        <input type="text" id="userInput" placeholder="Type the captcha text" autocomplete="off">
        <button onclick="checkCaptcha()">Submit</button>
        <div id="statusMsg" class="msg"></div>
    </div>
</div>

<script>
    let balance = 20;
    let correctCount = 10;
    let wrongCount = 0;
    let currentCaptcha = "";

    function generateCaptcha() {
        currentCaptcha = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById("captchaCode").innerText = currentCaptcha;
    }

    function updateStats() {
        let total = correctCount + wrongCount;
        let rate = total === 0 ? 100 : Math.round((correctCount / total) * 100);
        
        document.getElementById("balance").innerText = balance;
        document.getElementById("correct").innerText = correctCount;
        document.getElementById("wrong").innerText = wrongCount;
        document.getElementById("rate").innerText = rate + "%";
    }

    function checkCaptcha() {
        let inputVal = document.getElementById("userInput").value.trim();
        let msg = document.getElementById("statusMsg");

        if (!inputVal) return;

        if (inputVal === currentCaptcha) {
            balance += 2;
            correctCount++;
            msg.className = "msg success";
            msg.innerText = "✅ Correct! You have earned 2 BDT";
        } else {
            wrongCount++;
            msg.className = "msg error";
            msg.innerText = "❌ Incorrect captcha! Try again.";
        }

        updateStats();
        document.getElementById("userInput").value = "";
        generateCaptcha();
    }

    // Initialize initial captcha
    generateCaptcha();
</script>

</body>
</html>
