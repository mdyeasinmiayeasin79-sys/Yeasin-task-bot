<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার রিংটোন ওয়েবসাইট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .player-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            outline: none;
        }

        .btn {
            background: #764ba2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #5a3782;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎵 প্লে-লিস্ট ও রিংটোন</h1>
        <p>আপনার পছন্দের গান এবং রিংটোন সহজেই শুনুন।</p>
        
        <div class="player-box">
            <!-- audio_link_here এর জায়গায় আপনার অডিও ফাইলের লিংক দিন -->
            <audio controls>
                <source src="ringtone.mp3" type="audio/mpeg">
                আপনার ব্রাউজার অডিও সাপোর্ট করে না।
            </audio>
        </div>

        <button class="btn" onclick="alert('রিংটোন প্লে হচ্ছে!')">রিংটোন চালু করুন</button>
    </div>

</body>
</html>
